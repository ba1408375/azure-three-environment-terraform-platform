<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZiCON WebXR Demo</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
}
#info{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:8px;
    font-family:Arial;
}
</style>

</head>

<body>

<div id="info">
<h2>ZiCON WebXR Demo</h2>
<p>Use:</p>
<p>Arrow keys</p>
<p>or W A S D</p>
<p>Mouse to Look Around</p>
</div>

<a-scene>

<a-sky color="#87CEEB"></a-sky>

<a-plane
rotation="-90 0 0"
width="100"
height="100"
color="#7BC8A4">
</a-plane>

<a-box
position="0 0.5 -5"
color="red">
</a-box>

<a-sphere
position="4 1 -8"
radius="1"
color="blue">
</a-sphere>

<a-cylinder
position="-4 1 -8"
radius="0.7"
height="2"
color="green">
</a-cylinder>

<a-text
value="Welcome to ZiCON WebXR"
position="-3 3 -6"
color="black"
width="10">
</a-text>

<a-entity
camera
look-controls
wasd-controls
position="0 1.6 5">
</a-entity>

</a-scene>

</body>
</html>
